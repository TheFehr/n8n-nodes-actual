# Must stay named publish.yml: the package's npm Trusted Publisher names this file.
name: Publish

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: TheFehr/n8n-node-tooling/.github/workflows/publish.yml@be728ebed0f05b003366f00dfae0702f9617cb28
    with:
      tooling-ref: be728ebed0f05b003366f00dfae0702f9617cb28
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
